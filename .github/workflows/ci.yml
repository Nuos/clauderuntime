name: CI

# B6 Wave F8 — CI 定位为 RELEASE_GATE（发布门禁），不是功能开发门禁。
# 结果与 local 分开记录（B6 规则：不得把 CI 结果写成 local 结果，反之亦然）。
#
# - docs-governance: 文档治理门禁（结构/链接/parity 台账/B6 差异 registry）
#   —— 快速、stdlib-only，任何 PR 都跑。
# - tests: Python 测试套件（跳过 integration 标记：外部 MCP/服务类测试）。
#   运行在 macos-latest（项目主开发平台，与文档化 local 套件一致；
#   Linux runner 上 sandbox-exec/bwrap 探测会 fail-closed 导致平台用例失败）。
#
# 已知平台差异：Windows/Linux 真机验证见
# docs/reference-differences/platform-verification.md（PENDING_REAL_DEVICE）。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  docs-governance:
    name: Docs governance gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run documentation governance check
        run: python scripts/check_docs_governance.py

  tests:
    name: Python test suite (non-integration)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.dev.txt
      - name: Run test suite
        run: python -m pytest tests/ -q --disable-warnings -m "not integration"
