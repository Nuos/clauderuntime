name: CI

# B7 W7 — CI/Test Truth (Behavior Bible §O): the deselect/quarantine list
# comes from ONE machine manifest (machine/ci-quarantine.yaml); the workflow
# NEVER hand-writes deselects. scripts/generate_ci_deselect_args.py produces
# the args and scripts/check_quarantine_manifest.py fails the gate when the
# manifest is stale/duplicated. Platform + Python matrix is DECLARED in
# machine/test-matrix.yaml (declared ≠ verified — real-device isolation is
# tracked separately in docs/reference-differences/platform-verification.md).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  docs-governance:
    name: Docs governance gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run documentation governance check
        run: python scripts/check_docs_governance.py
      - name: Validate quarantine manifest + reference lock
        run: |
          python -m pip install pyyaml
          python scripts/check_quarantine_manifest.py
          python scripts/check_reference_lock.py

  tests:
    name: Python test suite (non-integration)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.dev.txt
      - name: Run test suite
        # Quarantine args are GENERATED from machine/ci-quarantine.yaml
        # (single source of truth, B7 W7). Items carry reason + replacement
        # coverage; local full suite still runs them.
        run: >-
          python -m pytest tests/ -q --disable-warnings -m "not integration"
          $(python scripts/generate_ci_deselect_args.py)

  platform-python-matrix:
    name: Declared matrix smoke (import-only)
    # B7 W7 — declared compatibility vs verified are separate statements
    # (Behavior Bible §P): this job validates the DECLARATION and runs an
    # import smoke on the primary platform only. Python 3.10/3.14 and
    # Ubuntu/Windows full runs are PENDING_REAL_DEVICE (tracked in
    # machine/test-matrix.yaml + docs/reference-differences/platform-verification.md).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate test matrix declaration
        run: |
          python - <<'EOF'
          import yaml
          m = yaml.safe_load(open("machine/test-matrix.yaml"))
          assert m["schema"] == 1
          assert "local_full" in m["levels"] and "os_smoke" in m["levels"]
          assert m["rules"]["os_smoke_does_not_imply_isolation_verified"] is True
          print("PASS test matrix declaration:", list(m["levels"]))
          EOF
      - name: Import smoke
        run: |
          python -m pip install -r requirements.dev.txt
          python -c "import src.entrypoints.headless, src.server.agent_server, src.query.query, src.services.compact.pipeline; print('import smoke ok')"
