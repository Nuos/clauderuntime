  - id: DIFF-SANDBOX-001
    area: CCR-12
    feature: platform_isolation_backends
    reference_certainty: R1_CONFIRMED
    alignment_policy: MUST_ALIGN
    reference:
      file: "utils/sandbox/sandbox-adapter.ts + tools/BashTool/shouldUseSandbox.ts"
      symbol: sandbox adapter / isolation contract
      behavior: "commands execute inside a real OS sandbox when isolation is required; capability and provides_isolation are truthful"
      certainty: CONFIRMED
    python:
      file: src/execution/sandbox.py
      symbol: MacOSSandboxBackend / LinuxSandboxBackend / WindowsSandboxBackend / NoSandboxBackend / default_sandbox_backend
      behavior: "macOS uses Seatbelt (real isolation); Linux uses bubblewrap (real isolation); Windows uses Job Object process-tree containment (LIMITED, no filesystem/network sandbox); no-sandbox backend reports provides_isolation=False; require_isolation always fails closed"
    difference: "Platform primitive selection differs per OS; isolation must not silently degrade to unrestricted execution."
    reason: OS_PLATFORM_ADAPTATION
    user_impact: LOW
    safety_impact: NONE
    compatibility_impact: LOW
    status: FUNCTIONAL_ADAPTATION
    accepted: true
    acceptance_reason: "B6 Wave F5: every platform must report real capability and fail closed under require_isolation; never claim sandboxed without isolation. Windows Job Object path is LIMITED until verified on win32."
    tests:
      - tests/test_b6_linux_windows_sandbox.py
      - tests/test_b6_sandbox_guard_capability.py
      - tests/test_sandbox_guard.py
    notes: "Windows Job Object launcher (src/execution/win_job_launcher.py) follows MSDN layouts; requires a win32 host to execute — unit tests on macOS pin capability/prepare/fail-closed and the argv shape. Linux bubblewrap requires a Linux host for real container execution. Real-device verification is tracked in docs/reference-differences/platform-verification.md (PENDING_REAL_DEVICE)."

