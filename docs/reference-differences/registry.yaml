      symbol: resume_agent_background / _rebuild_run_params_from_current_runtime
      behavior: "resumes from transcript + DurableResumeMetadata using current-process provider/tool registry; fails clearly when the recorded worktree is missing; no content replacement / worktree auto-repair"
